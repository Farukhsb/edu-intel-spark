name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
      VITE_SUPABASE_PROJECT_ID: test-project
      VITE_APP_ENV: test
      VITE_ANALYTICS_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase migration consistency
        # Requires GitHub secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          npx supabase link --project-ref huncjayakgnqdgizzfjx --password "$SUPABASE_DB_PASSWORD"

          diff_file="$(mktemp)"
          npx supabase db diff --linked --schema public > "$diff_file"

          if grep -Eq '^[[:space:]]*(ALTER|CREATE|COMMENT|DROP|GRANT|REVOKE|DO|INSERT|UPDATE|DELETE|TRUNCATE)\b' "$diff_file"; then
            echo "Supabase migration diff detected. Commit the missing migration(s) before merging."
            cat "$diff_file"
            exit 1
          fi

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run permission contract tests
        run: npm run test:access

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
