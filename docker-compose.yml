services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradeai-app
    env_file:
      - .env.local
    environment:
      VITE_APP_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 8080
